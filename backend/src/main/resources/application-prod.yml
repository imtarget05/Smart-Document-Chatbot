spring:
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: smartdoc
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

# Production security headers
security:
  prompt-injection:
    enabled: true
  internal-token: ${INTERNAL_SERVICE_TOKEN}

# Production rate limits (higher for internal users)
ratelimit:
  enabled: true
  chat-per-minute: 60
  upload-per-minute: 20
  auth-per-minute: 20

# Production CRAG settings
crag:
  confidence-threshold: 0.6
  top-k: 5
  max-reformulations: 3
  web-search-enabled: false
  abstain-enabled: true

logging:
  level:
    root: WARN
    com.smartdocchat: INFO
  file:
    name: /var/log/smartdoc/application.log
    max-size: 50MB
    max-history: 60
