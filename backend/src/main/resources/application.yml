spring:
  application:
    name: smart-doc-chatbot
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/smart_doc_chatbot}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET:c21hcnQtZG9jLWNoYXRib3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtMjAyNg==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080,http://127.0.0.1:3000}

llm:
  base-url: ${LLM_BASE_URL:http://localhost:8001}
  chat-model: ${LLM_CHAT_MODEL:qwen2.5:7b}
  embedding-model: ${LLM_EMBEDDING_MODEL:nomic-embed-text}
  temperature: ${LLM_TEMPERATURE:0.3}
  max-attempts: ${LLM_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:250}

# Corrective RAG (CRAG) — confidence evaluation + query reformulation +
# web-search fallback for the classic /chat/ask & /chat/ask-stream endpoints.
crag:
  # Chunks with max score below this trigger query reformulation / fallback.
  confidence-threshold: ${CRAG_CONFIDENCE_THRESHOLD:0.6}
  # Number of top chunks kept at each retrieval stage.
  top-k: ${CRAG_TOP_K:3}
  # Number of alternative reformulations to try on low confidence.
  max-reformulations: ${CRAG_MAX_REFORMULATIONS:2}
  # Allow automatic web-search fallback on low confidence (independent of the
  # per-request `webSearch` flag). Requires Tavily to be configured.
  web-search-enabled: ${CRAG_WEB_SEARCH_ENABLED:false}

# Tavily web search (optional). Disabled when api-key is empty.
tavily:
  api-key: ${TAVILY_API_KEY:}
  url: ${TAVILY_URL:https://api.tavily.com/search}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.smartdocchat: ${LOGGING_LEVEL_COM_SMARTDOCCHAT:DEBUG}
  file:
    name: ${LOG_FILE:logs/application.log}
    max-size: 10MB
    max-history: 30

storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    upload-dir: ${LOCAL_UPLOAD_DIR:uploads}