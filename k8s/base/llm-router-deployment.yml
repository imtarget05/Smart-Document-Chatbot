apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-router-config
  labels:
    app: llm-router
data:
  ROUTER_CONFIDENCE_THRESHOLD: "0.7"
  CLOUDFLARE_CHAT_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
  CLOUDFLARE_EMBED_MODEL: "@cf/baai/bge-base-en-v1.5"
  CLOUDFLARE_TIMEOUT_SECONDS: "60"
---
# Template only. Replace with Sealed Secrets or External Secrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: llm-router-secrets
  labels:
    app: llm-router
type: Opaque
stringData:
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_API_TOKEN: ""
  ROUTER_INTERNAL_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  labels:
    app: llm-router
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/component: ai-routing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
        app.kubernetes.io/name: llm-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: llm-router
          image: ghcr.io/OWNER/smart-doc-chatbot/llm-router:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: llm-router-config
            - secretRef:
                name: llm-router-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  labels:
    app: llm-router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app: llm-router
