# Local development docker-compose for eval pipeline (free-tier, in-memory)
# Usage: docker compose -f docker/docker-compose.local.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdoc-local-postgres
    environment:
      POSTGRES_DB: smartdoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.10
    container_name: smartdoc-local-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_local:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: smartdoc-local-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_local:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata_local:
  qdrant_local:
  ollama_local:
