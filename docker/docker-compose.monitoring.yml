# ============================================
# Smart Document Chatbot - Monitoring Overlay
# Additive-only: adds Loki + Promtail (logging).
# Prometheus & Grafana are defined in the base
# docker-compose.yml (production stack).
#
# Usage: docker compose -f docker/docker-compose.monitoring.yml up -d
# ============================================

services:
  # --- Loki (Log Aggregation) ---
  loki:
    image: grafana/loki:2.9.0
    container_name: sdc-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - app-network

  # --- Promtail (Log Collector) ---
  promtail:
    image: grafana/promtail:2.9.0
    container_name: sdc-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - app-network

  # --- Langfuse (Observability & Eval) — self-hosted, dev/local only ---
  # Run `docker compose -f docker/docker-compose.monitoring.yml up -d` then open
  # http://localhost:3000 and log in as admin@local.dev / admin12345 to create the
  # "smart-doc-chatbot" project and get API keys. Render staging uses Langfuse Cloud
  # (set LANGFUSE_* env on the Render dashboard instead) because Render cannot run
  # compose sidecars.
  #
  # ClickHouse: langfuse:3 server expects an external ClickHouse. Set
  # CLICKHOUSE_URL + CLICKHOUSE_USER + CLICKHOUSE_PASSWORD on langfuse-server
  # to connect. The separate clickhouse service below mounts clickhouse_override_ipv4.xml
  # to bind to 0.0.0.0 (fixes "IPv6 listen failed" on IPv4-only hosts).
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sdc-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse_override_ipv4.xml:/etc/clickhouse-server/config.d/override_ipv4.xml:ro
      - langfuse_ch_data:/var/lib/clickhouse
      - langfuse_ch_logs:/var/log/clickhouse-server
    networks:
      - app-network

  # Langfuse DB: Postgres for metadata (users, projects, etc.)
  langfuse-db:
    image: postgres:14-alpine
    container_name: sdc-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Langfuse Server
  langfuse-server:
    image: langfuse/langfuse:3
    container_name: sdc-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      SALT: ${LANGFUSE_SALT:-local-dev-salt-change-me}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-nextauth-secret}
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-local-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-smart-doc-chatbot}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-local-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-local-org}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@local.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-admin12345}
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  loki_data:
    driver: local
  langfuse_db_data:
    driver: local
  langfuse_ch_data:
    driver: local
  langfuse_ch_logs:
    driver: local
