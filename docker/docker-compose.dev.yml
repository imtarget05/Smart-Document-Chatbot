# ============================================
# Smart Document Chatbot - Development Docker Compose
# Only starts infrastructure services that still run locally in dev:
#   - llm-router (Cloudflare Workers AI)
#   - Agent service (hot-reload)
#   - pgAdmin (optional, --profile tools)
#
# PostgreSQL → Neon Cloud (set NEON_DATABASE_URL in .env)
# Qdrant     → Qdrant Cloud (set QDRANT_HOST/API_KEY) OR local below
# Storage    → Cloudflare R2 (STORAGE_PROVIDER=r2) OR local disk (local, default)
#
# Usage: docker compose -f docker/docker-compose.dev.yml up -d
# ============================================

services:

  # ── PostgreSQL (local dev option) ───────────────────────────────────────────
  # Comment this out if using Neon (set SPRING_DATASOURCE_URL in .env instead).
  postgres:
    image: postgres:15-alpine
    container_name: sdc-postgres-dev
    environment:
      POSTGRES_DB: smart_doc_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (local dev option) ────────────────────────────────────────────────
  # Comment this out if using Qdrant Cloud (set QDRANT_HOST/etc. in .env).
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sdc-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LLM Router (Cloudflare Workers AI) ────────────────────────────────────
  llm-router:
    build:
      context: ../llm-router
      dockerfile: Dockerfile
    container_name: sdc-llm-router-dev
    environment:
      ROUTER_CONFIDENCE_THRESHOLD: ${ROUTER_CONFIDENCE_THRESHOLD:-0.7}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_CHAT_MODEL: ${CLOUDFLARE_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      CLOUDFLARE_EMBED_MODEL: ${CLOUDFLARE_EMBED_MODEL:-@cf/baai/bge-base-en-v1.5}
      CLOUDFLARE_TIMEOUT_SECONDS: ${CLOUDFLARE_TIMEOUT_SECONDS:-60}
    ports:
      - "${LLM_ROUTER_PORT:-8001}:8000"
    restart: unless-stopped

  # ── Python Agent Service (hot-reload) ───────────────────────────────────────
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: sdc-agent-dev
    environment:
      APP_ENV: local
      INTERNAL_SERVICE_TOKEN: local-development-service-token-change-me
      LLM_BASE_URL: http://llm-router:8000
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-@cf/baai/bge-base-en-v1.5}
      # Qdrant — points to local container by default (no auth in local dev)
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # PostgreSQL — points to local container by default
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: smart_doc_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REPORT_OUTPUT_DIR: /app/reports
    ports:
      - "9000:9000"
    volumes:
      - ../agent:/app
      - ../data:/data
      - agent_dev_reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-router:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload
    restart: unless-stopped

  # ── n8n (workflow automation) ────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: sdc-n8n-dev
    environment:
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_dev_data:/home/node/.n8n
    depends_on:
      - n8n-postgres
    restart: unless-stopped

  n8n-postgres:
    image: postgres:16-alpine
    container_name: sdc-n8n-postgres-dev
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
      POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n}
    volumes:
      - n8n_postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── pgAdmin (optional, activate with --profile tools) ───────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sdc-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartdoc.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_dev_data:
    driver: local
  qdrant_dev_data:
    driver: local
  agent_dev_reports:
    driver: local
  n8n_dev_data:
    driver: local
  n8n_postgres_dev_data:
    driver: local
