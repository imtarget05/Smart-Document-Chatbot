services:
- type: web
  name: smart-doc-supply-chain-api
  runtime: python
  rootDir: supply-chain-module
  plan: free
  buildCommand: pip install -r api/requirements.txt
  startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: SUPPLY_CHAIN_INTERNAL_TOKEN
    sync: false
- type: web
  name: smart-doc-supply-chain-dashboard
  runtime: python
  rootDir: supply-chain-module
  plan: free
  buildCommand: pip install -r api/requirements.txt
  startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
  autoDeploy: false
  envVars:
  - key: SUPPLY_CHAIN_API_URL
    fromService:
      name: smart-doc-supply-chain-api
      type: web
      property: host
- type: web
  name: smart-doc-llm-router
  runtime: python
  rootDir: llm-router
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: CLOUDFLARE_ACCOUNT_ID
    sync: false
  - key: CLOUDFLARE_API_TOKEN
    sync: false
  - key: CLOUDFLARE_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: CLOUDFLARE_EMBED_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: CLOUDFLARE_TIMEOUT_SECONDS
    value: '60'
  - key: ROUTER_CONFIDENCE_THRESHOLD
    value: '0.7'
  - key: ROUTER_INTERNAL_TOKEN
    sync: false
  - key: SUPPLY_CHAIN_API_URL
    fromService:
      name: smart-doc-supply-chain-api
      type: web
      property: host
  - key: REDIS_URL
    sync: false
  - key: LANGFUSE_ENABLED
    value: 'true'
  - key: LANGFUSE_HOST
    value: https://cloud.langfuse.com
  - key: LANGFUSE_PUBLIC_KEY
    sync: false
  - key: LANGFUSE_SECRET_KEY
    sync: false
- type: web
  name: smart-doc-backend
  runtime: docker
  rootDir: .
  plan: free
  dockerfilePath: docker/Dockerfile.backend
  autoDeploy: true
  healthCheckPath: /api/actuator/health
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: production
  - key: LLM_BASE_URL
    fromService:
      name: smart-doc-llm-router
      type: web
      property: host
  - key: LLM_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: LLM_EMBEDDING_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: LLM_TEMPERATURE
    value: '0.3'
  - key: STORAGE_PROVIDER
    value: r2
  - key: R2_ACCOUNT_ID
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
  - key: R2_BUCKET_NAME
    value: smart-doc-documents
  - key: SPRING_DATASOURCE_URL
    sync: false
  - key: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update
  - key: QDRANT_HOST
    sync: false
  - key: QDRANT_PORT
    value: '6333'
  - key: QDRANT_USE_HTTPS
    value: 'true'
  - key: QDRANT_API_KEY
    sync: false
  - key: QDRANT_COLLECTION
    value: documents
  - key: JWT_SECRET
    sync: false
  - key: INTERNAL_SERVICE_TOKEN
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    value: https://smart-doc-chatbot.pages.dev,https://*.smart-doc-chatbot.pages.dev,https://smart-doc.pages.dev,https://smart-doc-frontend.pages.dev
  # Langfuse Cloud (opt-in, zero overhead when keys empty — now ENABLED per contract)
  - key: LANGFUSE_ENABLED
    value: 'true'
  - key: LANGFUSE_HOST
    value: https://cloud.langfuse.com
  - key: LANGFUSE_PUBLIC_KEY
    sync: false
  - key: LANGFUSE_SECRET_KEY
    sync: false
  # Redis for distributed rate limiting (optional, falls back to in-memory)
  - key: REDIS_HOST
    sync: false
  - key: REDIS_PORT
    value: '6379'
  - key: REDIS_PASSWORD
    sync: false
  # SSO prod (Keycloak/Azure AD/Okta) — disabled until Keycloak public URL ready (local http://localhost:8180 not reachable from Render)
  # Set to 'true' and fill SSO_OIDC_ISSUER_URI with https://smartdoc-keycloak.onrender.com/realms/smartdoc after Keycloak service is healthy
  - key: SSO_OIDC_ENABLED
    value: 'false'
  - key: SSO_OIDC_ISSUER_URI
    sync: false
  - key: SSO_OIDC_CLIENT_ID
    sync: false
  - key: SSO_OIDC_CLIENT_SECRET
    sync: false
  - key: SSO_OIDC_POST_LOGIN_REDIRECT
    value: https://smart-doc.pages.dev
  - key: SSO_OIDC_ADMIN_USERNAMES
    sync: false
  - key: LOGGING_LEVEL_ROOT
    value: WARN
  - key: LOGGING_LEVEL_COM_SMARTDOCCHAT
    value: INFO
- type: web
  name: smart-doc-agent
  runtime: python
  rootDir: agent
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  plan: free
  envVars:
  - key: AGENT_PORT
    value: '9000'
  - key: BACKEND_URL
    fromService:
      name: smart-doc-backend
      type: web
      property: host
# Keycloak SSO (free, prod issuer for SSO_OIDC_ISSUER_URI)
# Public URL will be https://smartdoc-keycloak.onrender.com/realms/smartdoc
- type: web
  name: smartdoc-keycloak
  runtime: docker
  plan: free
  dockerfilePath: docker/Dockerfile.keycloak
  autoDeploy: true
  healthCheckPath: /realms/master
  envVars:
  - key: KEYCLOAK_ADMIN
    value: admin
  - key: KEYCLOAK_ADMIN_PASSWORD
    sync: false
  - key: KC_HOSTNAME
    value: https://smartdoc-keycloak.onrender.com
  - key: KC_PROXY
    value: edge
