services:
- type: web
  name: smart-doc-supply-chain-api
  runtime: python
  rootDir: supply-chain-module
  plan: free
  buildCommand: pip install -r api/requirements.txt
  startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: SUPPLY_CHAIN_INTERNAL_TOKEN
    sync: false
- type: web
  name: smart-doc-supply-chain-dashboard
  runtime: python
  rootDir: supply-chain-module
  plan: free
  buildCommand: pip install -r api/requirements.txt
  startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
  autoDeploy: false
  envVars:
  - key: SUPPLY_CHAIN_API_URL
    fromService:
      name: smart-doc-supply-chain-api
      type: web
      property: host
- type: web
  name: smart-doc-llm-router
  runtime: python
  rootDir: llm-router
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  envVars:
  - key: CLOUDFLARE_ACCOUNT_ID
    sync: false
  - key: CLOUDFLARE_API_TOKEN
    sync: false
  - key: CLOUDFLARE_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: CLOUDFLARE_EMBED_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: CLOUDFLARE_TIMEOUT_SECONDS
    value: '60'
  - key: ROUTER_CONFIDENCE_THRESHOLD
    value: '0.7'
  - key: ROUTER_INTERNAL_TOKEN
    sync: false
  - key: SUPPLY_CHAIN_API_URL
    fromService:
      name: smart-doc-supply-chain-api
      type: web
      property: host
  - key: REDIS_URL
    sync: false
- type: web
  name: smart-doc-backend
  runtime: docker
  rootDir: .
  plan: free
  dockerfilePath: docker/Dockerfile.backend
  autoDeploy: true
  healthCheckPath: /api/actuator/health
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: production
  - key: LLM_BASE_URL
    fromService:
      name: smart-doc-llm-router
      type: web
      property: host
  - key: LLM_CHAT_MODEL
    value: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - key: LLM_EMBEDDING_MODEL
    value: '@cf/baai/bge-base-en-v1.5'
  - key: LLM_TEMPERATURE
    value: '0.3'
  - key: STORAGE_PROVIDER
    value: r2
  - key: R2_ACCOUNT_ID
    sync: false
  - key: R2_ACCESS_KEY_ID
    sync: false
  - key: R2_SECRET_ACCESS_KEY
    sync: false
  - key: R2_BUCKET_NAME
    value: smart-doc-documents
  - key: SPRING_DATASOURCE_URL
    sync: false
  - key: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update
  - key: QDRANT_HOST
    sync: false
  - key: QDRANT_PORT
    value: '6333'
  - key: QDRANT_USE_HTTPS
    value: 'true'
  - key: QDRANT_API_KEY
    sync: false
  - key: QDRANT_COLLECTION
    value: documents
  - key: JWT_SECRET
    sync: false
  - key: INTERNAL_SERVICE_TOKEN
    sync: false
  - key: CORS_ALLOWED_ORIGINS
    value: '*'
  - key: LOGGING_LEVEL_ROOT
    value: WARN
  - key: LOGGING_LEVEL_COM_SMARTDOCCHAT
    value: INFO
- type: web
  name: smart-doc-agent
  runtime: python
  rootDir: agent
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  plan: free
  envVars:
    AGENT_PORT: '9000'
    BACKEND_URL:
      fromService:
        name: smart-doc-backend
        type: web
        property: host
