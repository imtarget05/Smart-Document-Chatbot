name: "Eval (Hermetic Local LLM)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 1. Offline grader unit tests — zero network, zero LLM.
  # ────────────────────────────────────────────────────────────────────────
  offline-grader-test:
    name: "Offline grader tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grader test deps
        run: |
          python -m pip install --upgrade pip
          # eval/eval.py (unit under test) imports `requests` at module load,
          # so the grader job needs it too — not just pytest.
          pip install pytest requests

      - name: Run offline grader tests
        run: python3 -m pytest tests/test_grader.py -q

  # ────────────────────────────────────────────────────────────────────────
  # 2. Mock Ollama + mock backend end-to-end. This proves the eval pipeline
  #    works against a hermetic local LLM stack (no Render, no network).
  # ────────────────────────────────────────────────────────────────────────
  mock-ollama-eval:
    name: "Mock Ollama fixture eval"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mock + eval deps
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements.txt fastapi uvicorn pytest

      - name: Boot mock Ollama on :11434
        run: |
          mkdir -p eval/logs
          nohup python eval/mock_ollama.py > eval/logs/mock_ollama.log 2>&1 &
          echo $! > eval/logs/mock_ollama.pid
          echo "Mock Ollama PID=$(cat eval/logs/mock_ollama.pid)"

      - name: Wait for Mock Ollama /api/tags
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Mock Ollama ready after ${i}s"
              curl -s http://localhost:11434/api/tags | head -c 400
              echo
              exit 0
            fi
            sleep 1
          done
          echo "FATAL: Mock Ollama never became ready"
          tail -n 50 eval/logs/mock_ollama.log || true
          exit 1

      - name: Boot mock backend on :8081
        run: |
          nohup python eval/mock_backend.py > eval/logs/mock_backend.log 2>&1 &
          echo $! > eval/logs/mock_backend.pid
          echo "Mock backend PID=$(cat eval/logs/mock_backend.pid)"

      - name: Wait for Mock backend /api/actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/api/actuator/health >/dev/null 2>&1; then
              echo "Mock backend ready after ${i}s"
              curl -s http://localhost:8081/api/actuator/health
              echo
              exit 0
            fi
            sleep 1
          done
          echo "FATAL: Mock backend never became ready"
          tail -n 50 eval/logs/mock_backend.log || true
          exit 1

      - name: Run fixture benchmark against mocks
        run: |
          set -e
          mkdir -p eval/results
          python eval/run_fixture_eval.py \
            --base-url http://localhost:8081/api \
            --output eval/results/fixture_eval.json

      - name: Tear down mocks
        if: always()
        run: |
          for pidfile in eval/logs/mock_ollama.pid eval/logs/mock_backend.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat $pidfile)" 2>/dev/null || true
            fi
          done
          pkill -f eval/mock_ollama.py 2>/dev/null || true
          pkill -f eval/mock_backend.py 2>/dev/null || true
          sleep 1

  # ────────────────────────────────────────────────────────────────────────
  # 3. Real Ollama HTTP contract smoke test. Demonstrates the actual
  #    "local LLM" capability on the runner (or skips cleanly if Docker is
  #    unavailable). The connectivity log is uploaded as proof.
  # ────────────────────────────────────────────────────────────────────────
  ollama-connectivity-check:
    name: "Ollama HTTP contract check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker availability
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Spin up real Ollama container
        if: steps.docker.outputs.available == 'true'
        run: |
          mkdir -p eval/logs
          docker run -d --rm \
            -p 11434:11434 \
            --name ci-ollama \
            ollama/ollama:latest \
            > eval/logs/ollama_container.log 2>&1 || true
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Real Ollama ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Verify Ollama HTTP API contract
        run: |
          {
            echo "==== Ollama HTTP contract check ===="
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if curl -fsS http://localhost:11434/api/tags; then
              echo
              echo "✅ /api/tags responded"
            else
              echo "⚠️ /api/tags not reachable (likely no Docker on runner) — skipping"
              exit 0
            fi
            echo
            echo "---- POST /api/chat (tiny prompt) ----"
            curl -fsS -X POST http://localhost:11434/api/chat \
              -H 'Content-Type: application/json' \
              -d '{"model":"llama3.2","messages":[{"role":"user","content":"ping"}],"stream":false}' \
              | head -c 600 || echo "(chat endpoint skipped — model not yet pulled)"
            echo
            echo "---- POST /api/embeddings (tiny prompt) ----"
            curl -fsS -X POST http://localhost:11434/api/embeddings \
              -H 'Content-Type: application/json' \
              -d '{"model":"nomic-embed-text","prompt":"ping"}' \
              | head -c 400 || echo "(embeddings endpoint skipped)"
            echo
          } > eval/logs/ollama_connectivity.log 2>&1 || true
          cat eval/logs/ollama_connectivity.log

      - name: Stop Ollama container
        if: always()
        run: |
          docker rm -f ci-ollama 2>/dev/null || true
          pkill -f ollama 2>/dev/null || true

  # ────────────────────────────────────────────────────────────────────────
  # 4. Upload all logs / results as artifacts (30-day retention).
  # ────────────────────────────────────────────────────────────────────────
  artifact-upload:
    name: "Upload logs & results"
    runs-on: ubuntu-latest
    needs:
      - offline-grader-test
      - mock-ollama-eval
      - ollama-connectivity-check
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download prior job logs (best-effort)
        run: |
          mkdir -p eval/logs eval/results
          echo "Logs will be uploaded as one artifact regardless of pass/fail."

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-local-llm-logs
          path: |
            eval/logs/
            eval/results/
          retention-days: 30
          if-no-files-found: ignore
