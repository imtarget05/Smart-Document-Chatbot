name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test
        run: cd backend && mvn test -B
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
      - name: Publish Test Summary
        uses: test-summary/actions@v2
        if: always()
        with:
          paths: backend/target/surefire-reports/TEST-*.xml

  llm-router-test:
    name: LLM Router Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-file: llm-router/requirements.txt
      - name: Install deps
        run: pip install -r llm-router/requirements.txt
      - name: Test llm-router
        run: cd llm-router && python -m pytest tests/ -v --tb=short
      - name: Upload router test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-router-test-reports
          path: llm-router/tests/reports/ || true

  docker-build-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend Docker image
        run: |
          docker build -f docker/Dockerfile.backend -t smart-doc-backend:smoke .
      - name: Build llm-router Docker image
        run: |
          docker build -f llm-router/Dockerfile -t smart-doc-llm-router:smoke ./llm-router
      - name: Build agent Docker image
        run: |
          docker build -f agent/Dockerfile -t smart-doc-agent:smoke ./agent

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/test-results/ || true

  e2e-test:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/ || true

  airflow-dag-check:
    name: Airflow DAG Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate DAGs & compose
        run: |
          python -m py_compile airflow/dags/document_ingestion_pipeline.py airflow/dags/model_retrain_pipeline.py
          python - <<'PY'
          import ast, glob, sys
          for f in glob.glob("airflow/dags/*.py"):
              ast.parse(open(f).read(), filename=f)
          print("all airflow DAGs parse OK")
          PY
          python -c "import yaml; list(yaml.safe_load_all(open('docker/docker-compose.yml'))); print('compose YAML parse OK')"
