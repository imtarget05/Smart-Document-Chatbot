name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test
        run: cd backend && mvn test -B
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
      - name: Publish Test Summary
        uses: test-summary/actions@v2
        if: always()
        with:
          paths: backend/target/surefire-reports/TEST-*.xml

  llm-router-test:
    name: LLM Router Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-file: llm-router/requirements.txt
      - name: Install deps
        run: pip install -r llm-router/requirements.txt
      - name: Test llm-router
        run: cd llm-router && python -m pytest tests/ -v --tb=short
      - name: Upload router test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-router-test-reports
          path: llm-router/tests/reports/ || true

  docker-build-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend Docker image
        run: |
          docker build -f docker/Dockerfile.backend -t smart-doc-backend:smoke .
      - name: Build llm-router Docker image
        run: |
          docker build -f llm-router/Dockerfile -t smart-doc-llm-router:smoke ./llm-router
      - name: Build agent Docker image
        run: |
          docker build -f agent/Dockerfile -t smart-doc-agent:smoke ./agent

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/test-results/ || true

  e2e-test:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/ || true

  airflow-dag-check:
    name: Airflow DAG Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate DAGs & compose
        run: |
          python -m py_compile airflow/dags/document_ingestion_pipeline.py airflow/dags/model_retrain_pipeline.py
          python - <<'PY'
          import ast, glob, sys
          for f in glob.glob("airflow/dags/*.py"):
              ast.parse(open(f).read(), filename=f)
          print("all airflow DAGs parse OK")
          PY
          python -c "import yaml; list(yaml.safe_load_all(open('docker/docker-compose.yml'))); print('compose YAML parse OK')"

  # Fullstack + Airflow LIVE smoke. Gated on cloud secrets so it only runs once
  # the repo owner adds Neon / Qdrant / R2 / Cloudflare creds to GitHub Secrets.
  # Without them the stack cannot start (no DB / vector store / storage / LLM).
  integration-smoke:
    name: Integration Smoke (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ secrets.NEON_DATABASE_URL != '' && secrets.QDRANT_HOST != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}
          QDRANT_HOST=${{ secrets.QDRANT_HOST }}
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          QDRANT_USE_HTTPS=${{ secrets.QDRANT_USE_HTTPS }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN }}
          AIRFLOW_INGEST_USERNAME=${{ secrets.AIRFLOW_INGEST_USERNAME }}
          AIRFLOW_INGEST_PASSWORD=${{ secrets.AIRFLOW_INGEST_PASSWORD }}
          EOF
      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d --wait --timeout 180
      - name: Health checks
        run: |
          curl -f http://localhost:8080/api/actuator/health
          curl -f http://localhost:9000/health
          docker compose -f docker/docker-compose.yml exec -T airflow-webserver airflow dags list
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  eval-questions-validate:
    name: Eval Question Set Validation (CI-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate eval questions
        run: |
          python eval/eval.py --validate-only --questions eval/questions.json
          python eval/agent_eval.py --validate-only --questions eval/agent_questions.json || true
      - name: Upload eval results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-validate-report
          path: eval/results/ || true
