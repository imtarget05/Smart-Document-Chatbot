name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend Tests
  # ═══════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smartdoc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartdoc_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS10ZXN0aW5nLTIwMjQ=
          INTERNAL_SERVICE_TOKEN: test-internal-token
        run: mvn clean verify -B

      - name: Check backend coverage threshold
        working-directory: ./backend
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "⚠️ No JaCoCo report found"
            exit 0
          fi
          # The jacoco-maven-plugin `check` goal already gates BUNDLE line
          # coverage at 65% during `mvn verify`; this surfaces the number in
          # the CI log as well.
          python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse("target/site/jacoco/jacoco.xml").getroot(); c = [x for x in r.findall("counter") if x.get("type") == "LINE"][0]; m, k = int(c.get("missed")), int(c.get("covered")); t = m + k; p = k / t if t else 0; print(f"Line coverage: {p:.2%} ({k}/{t})"); sys.exit(0 if p >= 0.65 else 1)'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ═══════════════════════════════════════════════════════════════
  # Frontend Tests
  # ═══════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test -- --run --coverage

      - name: Check frontend coverage threshold
        working-directory: ./frontend
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "⚠️ No coverage summary found"
            exit 0
          fi
          python3 -c 'import json, sys; d = json.load(open("coverage/coverage-summary.json")); pct = d.get("total", {}).get("lines", {}).get("pct", 0); print(f"Line coverage: {pct}%"); sys.exit(0 if pct >= 60 else 1)'

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

  # ═══════════════════════════════════════════════════════════════
  # Offline Eval Grader Tests (zero network / zero LLM)
  # ═══════════════════════════════════════════════════════════════
  eval-grader:
    name: Eval Grader Tests (offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline grader tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_grader.py -q

  # ═══════════════════════════════════════════════════════════════
  # Security Scan
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ═══════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: smartdoc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: smartdoc-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # Deploy (only on main branch)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render (optional)
        if: secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != ''
        uses: johnbeynon/render-deploy-action@v0.0.8
        continue-on-error: true
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Notify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "Images built: backend, frontend"
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "Images pushed to GHCR"
          else
            echo "No registry credentials — images built locally only"
          fi