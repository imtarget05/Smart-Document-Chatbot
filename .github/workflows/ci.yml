name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend Tests
  # ═══════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smartdoc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartdoc_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS10ZXN0aW5nLTIwMjQ=
          INTERNAL_SERVICE_TOKEN: test-internal-token
        run: mvn clean verify -B

      - name: Check backend coverage threshold
        working-directory: ./backend
        run: |
          COVERAGE=$(grep -o 'counter type="LINE"[^>]*' target/site/jacoco/index.html | grep -oP 'missed="\K[0-9]+|covered="\K[0-9]+' | head -2)
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "✅ JaCoCo report generated"
            python3 -c "
import xml.etree.ElementTree as ET
tree = ET.parse('target/site/jacoco/jacoco.xml')
root = tree.getroot()
for counter in root.findall('counter'):
    if counter.get('type') == 'LINE':
        missed = int(counter.get('missed', 0))
        covered = int(counter.get('covered', 0))
        total = missed + covered
        ratio = covered / total if total > 0 else 0
        print(f'Line coverage: {ratio:.2%} ({covered}/{total})')
        if ratio < 0.70:
            print(f'❌ Coverage {ratio:.2%} is below 70% threshold')
            exit(1)
        else:
            print(f'✅ Coverage {ratio:.2%} meets 70% threshold')
"
          else
            echo "⚠️ No JaCoCo report found"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ═══════════════════════════════════════════════════════════════
  # Frontend Tests
  # ═══════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test -- --run --coverage

      - name: Check frontend coverage threshold
        working-directory: ./frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "✅ Coverage report generated"
            python3 -c "
import json
with open('coverage/coverage-summary.json') as f:
    data = json.load(f)
total = data.get('total', {})
lines = total.get('lines', {})
pct = lines.get('pct', 0)
print(f'Line coverage: {pct}%')
if pct < 60:
    print(f'❌ Coverage {pct}% is below 60% threshold')
    exit(1)
else:
    print(f'✅ Coverage {pct}% meets 60% threshold')
"
          else
            echo "⚠️ No coverage summary found"
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

  # ═══════════════════════════════════════════════════════════════
  # Security Scan
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ═══════════════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfilePath: docker/Dockerfile.backend
          push: false
          tags: smartdoc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfilePath: docker/Dockerfile.frontend
          push: false
          tags: smartdoc-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # Deploy (only on main branch)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfilePath: docker/Dockerfile.backend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfilePath: docker/Dockerfile.frontend
          push: ${{ secrets.GHCR_TOKEN != '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:latest
            ghcr.io/${{ github.repository_owner }}/smartdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render (optional)
        if: secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != ''
        uses: johnbeynon/render-deploy-action@v0.0.8
        continue-on-error: true
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Notify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "Images built: backend, frontend"
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "Images pushed to GHCR"
          else
            echo "No registry credentials — images built locally only"
          fi