name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

jobs:
  # ============================================================
  # STAGE 1: Build & Unit Test
  # ============================================================

  backend-build:
    name: "1a. Backend - Build & Test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_doc_chatbot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout
          --health-retries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build & test
        working-directory: backend
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.actor }}

  frontend-build:
    name: "1b. Frontend - Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm run test:coverage
        env:
          CI: true

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            frontend/coverage
            frontend/e2e

  agent-tests:
    name: "1c. Agent - pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            llm-router/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install -r llm-router/requirements.txt

      - name: Run agent tests
        working-directory: agent
        run: python -m pytest tests -q

      - name: Run llm-router tests
        working-directory: llm-router
        run: python -m pytest tests -q

  sonarcloud-backend:
    name: "2. SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarcloud-frontend:
    name: "3. SonarCloud Analysis"
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        working-directory: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # STAGE 2: Docker Build & Push
  # ============================================================

  docker-build:
    name: "4. Build & push Docker images (GHCR)"
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, agent-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate lowercase image names
        id: image-names
        run: |
          BACKEND_IMAGE="${{ github.repository }}/backend"
          FRONTEND_IMAGE="${{ github.repository }}/frontend"
          echo "backend=$(echo $BACKEND_IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "frontend=$(echo $FRONTEND_IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata - Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.backend }}
          tags: |
            type=sha,prefix=
            type=ref,event=pr
            type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.backend }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.backend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata - Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-names.outputs.frontend }}
          tags: |
            type=sha,prefix=
            type=ref,event=pr
            type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.frontend }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.image-names.outputs.frontend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 3: Quality Gate
  # ============================================================

  ci-gate:
    name: "5. CI Quality Gate"
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
      - agent-tests
      - docker-build
      - sonarcloud-backend
      - sonarcloud-frontend
    if: always()
    steps:
      - name: Check all stages passed
        run: |
          echo "=== CI Quality Gate ==="
          echo "Backend build:     ${{ needs.backend-build.result }}"
          echo "Frontend build:    ${{ needs.frontend-build.result }}"
          echo "Agent tests:       ${{ needs.agent-tests.result }}"
          echo "Docker build:      ${{ needs.docker-build.result }}"
          echo "SonarCloud backend: ${{ needs.sonarcloud-backend.result }}"
          echo "SonarCloud frontend: ${{ needs.sonarcloud-frontend.result }}"

          if [[ "${{ needs.backend-build.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.agent-tests.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]] || \
             [[ "${{ needs.sonarcloud-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.sonarcloud-frontend.result }}" == "failure" ]]; then
            echo "::error::Critical CI stages failed!"
            exit 1

          if [[ "${{ needs.trivy-scan-backend.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy-scan-frontend.result }}" == "failure" ]]; then
            echo "::warning::Trivy detected CRITICAL/HIGH vulnerabilities. Review required."
          fi

          echo "CI Quality Gate: PASSED"

  # ============================================================
  # STAGE 4: Deploy
  # ============================================================

  deploy:
    name: "6. Deploy to Render"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_HOOK_URL"