name: "3. Eval & Regression"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r eval/requirements.txt
      - name: Run eval
        run: |
          cd eval
          python eval.py  # Sử dụng questions.json + golden set, in ra kết quả accuracy/latency
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/*