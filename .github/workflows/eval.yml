name: "3. Eval & Regression"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend API base URL (defaults to hermetic mock backend on :8081)"
        required: false
        default: "http://localhost:8081/api"
      run_full_suite:
        description: "Run the full 31-question suite instead of the fast fixture set"
        type: boolean
        default: false

jobs:
  fixture-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval + mock deps
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements.txt fastapi uvicorn

      # Hermetic local LLM stack: spin up mock Ollama + mock backend inside
      # the runner. No dependency on Render staging, no cold-start latency,
      # no flakiness. Mock_ollama.py serves /api/tags, /api/chat and
      # /api/embeddings so the router contract is exercised end-to-end.
      - name: Boot mock Ollama on :11434
        run: |
          mkdir -p eval/logs
          nohup python eval/mock_ollama.py > eval/logs/mock_ollama.log 2>&1 &
          echo $! > eval/logs/mock_ollama.pid

      - name: Wait for Mock Ollama /api/tags
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Mock Ollama ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FATAL: Mock Ollama never became ready"; exit 1

      - name: Boot mock backend on :8081
        run: |
          nohup python eval/mock_backend.py > eval/logs/mock_backend.log 2>&1 &
          echo $! > eval/logs/mock_backend.pid

      - name: Wait for Mock backend /api/actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/api/actuator/health >/dev/null 2>&1; then
              echo "Mock backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FATAL: Mock backend never became ready"; exit 1

      - name: Run fixture benchmark (fast gate)
        env:
          BASE_URL: ${{ inputs.base_url || 'http://localhost:8081/api' }}
        run: |
          python eval/run_fixture_eval.py --base-url "$BASE_URL" \
            --output eval/results/fixture_eval.json

      - name: Run full question suite (optional)
        if: ${{ inputs.run_full_suite == true }}
        env:
          BASE_URL: ${{ inputs.base_url || 'http://localhost:8081/api' }}
        run: |
          python eval/run_fixture_eval.py --base-url "$BASE_URL" \
            --questions eval/questions.json \
            --output eval/results/full_eval.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/results/
            eval/logs/
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("eval/results/fixture_eval.json")
          if p.exists():
              d = json.loads(p.read_text())
              s = d.get("summary", d)
              print(f"Fixture benchmark: errors={s.get('error_count')} "
                    f"provider_errors={s.get('provider_errors')} "
                    f"retrieval={s.get('retrieval_accuracy')} "
                    f"correctness={s.get('answer_correctness')} "
                    f"hallucinations={s.get('hallucination_cases')}")
          EOF

      - name: Tear down mocks
        if: always()
        run: |
          for pidfile in eval/logs/mock_ollama.pid eval/logs/mock_backend.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat $pidfile)" 2>/dev/null || true; fi
          done
          pkill -f eval/mock_ollama.py 2>/dev/null || true
          pkill -f eval/mock_backend.py 2>/dev/null || true
          sleep 1

  e2e-fullstack:
    name: "Full-stack E2E smoke (mock backend)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: UI smoke tests
        working-directory: frontend
        run: npx playwright test e2e/auth.spec.ts

      - name: Boot mock backend on :8081
        run: |
          mkdir -p eval/logs
          python -m pip install --upgrade pip fastapi uvicorn
          nohup python eval/mock_backend.py > eval/logs/mock_backend.log 2>&1 &
          echo $! > eval/logs/mock_backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/api/actuator/health >/dev/null 2>&1; then
              echo "Mock backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FATAL: Mock backend never became ready"; exit 1

      - name: Full-stack API smoke tests (against mock backend)
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8081/api
          E2E_EXPECT_IDEMPOTENT: '1'
        run: npx playwright test e2e/fullstack-smoke.spec.ts

      - name: Tear down mock backend
        if: always()
        run: |
          if [ -f eval/logs/mock_backend.pid ]; then kill "$(cat eval/logs/mock_backend.pid)" 2>/dev/null || true; fi
          pkill -f eval/mock_backend.py 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
