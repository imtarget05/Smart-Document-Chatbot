# ============================================
# Compliance & Post-Deploy Verification
# Runs after CD Pipeline completes or weekly.
# Verifies the live staging deployment is healthy.
# ============================================

name: Compliance & Verification

on:
  workflow_run:
    workflows: ["CD Pipeline"]
    types: [completed]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6:00 UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - verify

env:
  BACKEND_URL: https://smart-doc-backend-h4mt.onrender.com

permissions:
  contents: read

jobs:
  verify-staging:
    name: "Verify Staging Deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'verify')
    steps:
      # Render free tier can take a minute to wake up; retry generously.
      - name: Backend health check
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 \
            "$BACKEND_URL/api/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'

      # Client-facing CSRF surface. The CSRF controller is mapped to /csrf
      # and the server context-path is /api, so the full path is /api/csrf.
      - name: API surface reachable (CSRF)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$BACKEND_URL/api/csrf")
          echo "GET /api/csrf -> $code"
          [ "$code" = "200" ] || { echo "::error::CSRF endpoint unhealthy (HTTP $code)"; exit 1; }
