version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker (Dockerfiles and compose files in /docker)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  # Python dependencies (agent)
  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Python dependencies (llm-router)
  - package-ecosystem: "pip"
    directory: "/llm-router"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
